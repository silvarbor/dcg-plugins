# EXAMPLE dcg allowlist — REQUIRED companion to silvarbor.git_safety.
#
# A custom pack can add rules but cannot un-block what another pack blocks.
# The worktree-boundary charter permits git reset (all modes), path checkout,
# restore, and branch deletion because each was verified worktree-local — but
# dcg's built-in core.git pack blocks all four. These entries are what actually
# permit them. Without this file the pack reads as permissive while core.git
# quietly keeps denying.
#
# Every entry records the evidence for its decision, including one false
# positive observed in real use. Read them before adopting; they are decisions
# about a specific topology, not defaults.
#
# added_by / added_at are kept as-authored rather than blanked, so the
# provenance of each decision stays legible.

[[allow]]
rule = "core.git:branch-force-delete"
reason = 'Worktree-pool policy permits branch deletion, locally and remotely, as routine cleanup. Git enforces the cross-worktree boundary itself: `git branch -d/-D` and `git branch -f` both refuse a branch checked out in another worktree ("cannot delete branch X used by worktree at ..."), and deletion writes a reflog entry, so a branch checked out nowhere is recoverable. The plumbing bypass that carries no such guard is covered by silvarbor.git_safety:git-ref-delete-plumbing. This rule is also a false positive in its own right: --force\b matches --force-with-lease (the adjacent push-force-long rule already uses --force(?![-a-z]) for this exact reason).'
added_by = "shz"
added_at = "2026-05-18T10:40:35Z"

[[allow]]
rule = "core.git:checkout-discard"
reason = "Worktree-pool policy permits path checkout because it changes only the calling worktree's index and working tree."
added_by = "shz"
added_at = "2026-07-15T16:13:34Z"

[[allow]]
rule = "core.git:checkout-ref-discard"
reason = "Worktree-pool policy permits ref-to-path checkout because it changes only the calling worktree's index and working tree."
added_by = "shz"
added_at = "2026-07-15T16:13:34Z"

[[allow]]
rule = "core.git:restore-worktree"
reason = "Worktree-pool policy permits restore because it changes only the calling worktree's index and working tree."
added_by = "shz"
added_at = "2026-07-15T16:13:34Z"

[[allow]]
rule = "core.git:restore-worktree-explicit"
reason = "Worktree-pool policy permits explicit worktree restore because it changes only the calling worktree's index and working tree."
added_by = "shz"
added_at = "2026-07-15T16:13:34Z"

[[allow]]
rule = "core.git:reset-hard"
reason = "Worktree-pool policy permits reset in every mode. HEAD, the index, and the working tree are per-worktree: verified that `git reset --hard` in worktree A leaves worktree B's HEAD and working tree untouched, so reset cannot cross the boundary this policy exists to protect. Blocking it produced a real false positive on 2026-07-26 (a legitimate branch rebuild in the prowl repo: checkout, `reset --hard <sha>`, merge, push --force-with-lease). Supersedes the shz.git_safety:git-reset rule added in ece834b, now removed (the pack namespace was later renamed shz.* -> silvarbor.*)."
added_by = "shz"
added_at = "2026-07-27T00:00:00Z"

[[allow]]
rule = "core.git:reset-merge"
reason = "Worktree-pool policy permits reset in every mode; --merge is worktree-local for the same reason as --hard. See the core.git:reset-hard entry above."
added_by = "shz"
added_at = "2026-07-27T00:00:00Z"

# Help is an effective-policy concern. Pack-local safe patterns cannot override
# a matching rule from another pack. These entries accept only complete help
# commands, a known pager pipeline, or a final background marker. Redirects
# remain visible to filesystem rules.

[[allow]]
pattern = '''^\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:help|(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)help)(?:(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*"))*(?:[ \t]*(?:&|\|[ \t]*(?:less|more|cat)(?:(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*"))*))?\s*$'''
reason = "Shell help and an executable's immediate help subcommand only display usage. The full-line anchor permits a known pager or final background marker and rejects destructive neighbours."
risk_acknowledged = true
added_by = "shz"
added_at = "2026-08-07T00:00:00Z"

[[allow]]
pattern = '''^\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:(?!(?:-C|-c|--exec-path|--body|--visibility|-a|-b|-e|-o|-r|-u|--app|--env|--org|--repos|--user|--tag)(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)--help(?:\s|$))(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")(?:[ \t]*\\\r?\n[ \t]*|[ \t]+))*--help(?:(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*"))*(?:[ \t]*(?:&|\|[ \t]*(?:less|more|cat)(?:(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*"))*))?\s*$'''
reason = "An unquoted --help token makes a complete command display usage. Known value-taking options consume a following --help token as data instead."
risk_acknowledged = true
added_by = "shz"
added_at = "2026-08-08T00:00:00Z"

[[allow]]
pattern = '''^\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>"']*/)?git(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:(?:(?:-C|-c|--exec-path)(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")|-(?:C|c)[^\s&;|`()<>"']+|--exec-path=(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")|(?!-(?:C|c|--exec-path)(?:[ \t]*\\\r?\n[ \t]*|[ \t]+))-[^\s&;|`()<>"']+)(?:[ \t]*\\\r?\n[ \t]*|[ \t]+))+help(?:(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*"))*(?:[ \t]*(?:&|\|[ \t]*(?:less|more|cat)(?:(?:[ \t]*\\\r?\n[ \t]*|[ \t]+)(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*"))*))?\s*$'''
reason = "Git global options have declared arity before help matching. Their values are consumed before a later help subcommand is recognized."
risk_acknowledged = true
added_by = "shz"
added_at = "2026-08-08T00:00:00Z"
