# false positives / silvarbor.access_boundary
#
# Commands that do not change access or publish, supported publish dry runs,
# and prose that mentions a guarded command without performing one.

[[case]]
description = "gh pr create without --repo is allowed"
command = "gh pr create --fill"
expected = "allow"

[[case]]
description = "gh pr create --repo names its target"
command = "gh pr create --repo silvarbor/prowl --fill"
expected = "allow"

[[case]]
description = "--repo followed by more flags still carves out"
command = "gh pr create --repo acme/x --title t --body b"
expected = "allow"

[[case]]
description = "--repo after a quoted flag value still carves out"
command = "gh pr create --title \"ordinary title\" --repo acme/x --fill"
expected = "allow"

[[case]]
description = "--repo equals form names its target"
command = "gh pr create --title 'ordinary title' --repo=acme/x --fill"
expected = "allow"

[[case]]
description = "named-target PR after a neighbouring command"
command = "cd /repo; gh pr create --repo acme/x --fill"
expected = "allow"

[[case]]
description = "named-target multiline PR with heredoc body"
command = '''cd /Users/example/project
GIT_TERMINAL_PROMPT=0 gh pr create \
  --repo outcomeeng/claude-status \
  --base main \
  --head fix/always-output \
  --title "fix: guarantee one status line" \
  --body-file - <<'EOF'
## Summary

- The command names its target repository.
EOF'''
expected = "allow"

[[case]]
description = "gh pr list"
command = "gh pr list --state open"
expected = "allow"

[[case]]
description = "gh pr view"
command = "gh pr view 680 --json state"
expected = "allow"

[[case]]
description = "gh pr merge is not pull request creation"
command = "gh pr merge 42 --squash"
expected = "allow"

[[case]]
description = "gh release create is not a registry publish"
command = "gh release create v1.0.0 --generate-notes"
expected = "allow"

[[case]]
description = "gh secret list reads, it does not write"
command = "gh secret list"
expected = "allow"

[[case]]
description = "gh repo edit without --visibility"
command = "gh repo edit --description hello"
expected = "allow"

[[case]]
description = "npm install is not npm publish"
command = "npm install --frozen-lockfile"
expected = "allow"

[[case]]
description = "cargo build is not cargo publish"
command = "cargo build --release"
expected = "allow"

[[case]]
description = "npm publish dry run"
command = "npm publish --dry-run"
expected = "allow"

[[case]]
description = "cargo publish dry run"
command = "cargo publish --dry-run"
expected = "allow"

[[case]]
description = "poetry publish dry run"
command = "poetry publish --dry-run"
expected = "allow"

# Prose. A document or message that names a guarded command must not block.
# packs/readme.md records a handoff document blocked on 2026-07-27 for
# containing the words, which is what the command-position anchor prevents.
[[case]]
description = "prose mentioning gh pr create, single-quoted"
command = "echo 'run gh pr create to open one'"
expected = "allow"

[[case]]
description = "prose mentioning npm publish, double-quoted"
command = "echo \"never run npm publish from a laptop\""
expected = "allow"

[[case]]
description = "prose mentioning npm publish, unquoted in a commit message"
command = "git commit -m do not npm publish from a laptop"
expected = "allow"

[[case]]
description = "a prowl payload mentioning a guarded gh command is data"
command = "prowl send agent --prompt 'run gh repo edit --visibility public'"
expected = "allow"

[[case]]
description = "a guarded gh executable name inside another gh argument is data"
command = "gh issue create --body 'never run gh repo edit --visibility public'"
expected = "allow"

[[case]]
description = "a dry-run remains safe after more than sixty-four publish arguments"
command = "npm publish arg01 arg02 arg03 arg04 arg05 arg06 arg07 arg08 arg09 arg10 arg11 arg12 arg13 arg14 arg15 arg16 arg17 arg18 arg19 arg20 arg21 arg22 arg23 arg24 arg25 arg26 arg27 arg28 arg29 arg30 arg31 arg32 arg33 arg34 arg35 arg36 arg37 arg38 arg39 arg40 arg41 arg42 arg43 arg44 arg45 arg46 arg47 arg48 arg49 arg50 arg51 arg52 arg53 arg54 arg55 arg56 arg57 arg58 arg59 arg60 arg61 arg62 arg63 arg64 arg65 --dry-run"
expected = "allow"
