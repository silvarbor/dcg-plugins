# false positives / process hygiene safe
#
# Corpus cases for the silvarbor dcg packs, in the format documented at
# tests/corpus/README.md upstream. Run with:
#
#     dcg corpus -d tests/corpus --baseline tests/baseline.json
#
# NOTE: `dcg corpus` evaluates PACK MATCHING and does not apply allowlist.toml.
# Cases whose expected verdict depends on an allowlist entry cannot live here;
# they are in test/cases/*.tsv and run by test/run.sh. See test/README.md.


[[case]]
description = "fp grep for terms"
command = "grep -rn \"until\" docs/ && grep -rn \"sleep 5 &\" docs/"
expected = "allow"

[[case]]
description = "fp probe string arg"
command = "probe \"no_poll_loop\" \"while true; do sleep\""
expected = "allow"

[[case]]
description = "fp prose advice"
command = "Never use shell sleep, until/while polling, or a backgrounded watcher."
expected = "allow"

[[case]]
description = "sp sleep and and"
command = "sleep 5 && git status"
expected = "allow"

[[case]]
description = "sp sleep semicolon"
command = "sleep 5; git status"
expected = "allow"

[[case]]
description = "tn gh pr checks"
command = "gh pr checks 42 --watch --fail-fast --interval 30"
expected = "allow"

[[case]]
description = "tn gh run view"
command = "gh run view 123 --json status,conclusion"
expected = "allow"

[[case]]
description = "tn while read loop"
command = "while read -r line; do echo \"$line\"; done < file.txt"
expected = "allow"
