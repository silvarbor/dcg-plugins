# false positives / git worktree local
#
# Corpus cases for the silvarbor dcg packs, in the format documented at
# tests/corpus/README.md upstream. Run with:
#
#     dcg corpus -d tests/corpus --baseline tests/baseline.json
#
# NOTE: `dcg corpus` evaluates PACK MATCHING and does not apply allowlist.toml.
# Cases whose expected verdict depends on an allowlist entry cannot live here;
# they are in test/cases/*.tsv and run by test/run.sh. See test/README.md.


[[case]]
description = "fp echo double"
command = "echo \"the git stash drop hazard\""
expected = "allow"

[[case]]
description = "fp echo lease tail"
command = "echo hint --force-with-lease"
expected = "allow"

[[case]]
description = "fp echo single"
command = "echo 'do not run git worktree prune'"
expected = "allow"

[[case]]
description = "fp grep prose"
command = "grep -rn 'worktree prune' docs/"
expected = "allow"

[[case]]
description = "a prowl payload mentioning worktree removal is data"
command = "prowl send agent --prompt 'run git worktree remove ../peer'"
expected = "allow"

[[case]]
description = "a guarded Git executable name inside a commit message is data"
command = "git commit -m 'never run git worktree remove ../peer'"
expected = "allow"

[[case]]
description = "worktree add may use remove as a branch-name value"
command = "git worktree add -b remove ../peer"
expected = "allow"

[[case]]
description = "a prune dry-run remains safe after more than sixty-four arguments"
command = "git prune arg01 arg02 arg03 arg04 arg05 arg06 arg07 arg08 arg09 arg10 arg11 arg12 arg13 arg14 arg15 arg16 arg17 arg18 arg19 arg20 arg21 arg22 arg23 arg24 arg25 arg26 arg27 arg28 arg29 arg30 arg31 arg32 arg33 arg34 arg35 arg36 arg37 arg38 arg39 arg40 arg41 arg42 arg43 arg44 arg45 arg46 arg47 arg48 arg49 arg50 arg51 arg52 arg53 arg54 arg55 arg56 arg57 arg58 arg59 arg60 arg61 arg62 arg63 arg64 arg65 --dry-run"
expected = "allow"

[[case]]
description = "fp log then ls"
command = "git log --oneline; ls stash clear"
expected = "allow"

[[case]]
description = "fp word in path"
command = "ls /var/log/git-prune-report.txt"
expected = "allow"

[[case]]
description = "tn gc default"
command = "git gc"
expected = "allow"

[[case]]
description = "tn prune packed"
command = "git prune-packed"
expected = "allow"

[[case]]
description = "tn prune dry run long"
command = "git prune --dry-run"
expected = "allow"

[[case]]
description = "tn prune dry run short"
command = "git prune -n"
expected = "allow"

[[case]]
description = "tn gc retained objects"
command = "git gc --prune=2.weeks.ago"
expected = "allow"

[[case]]
description = "tn reflog configured expiration"
command = "git reflog expire --all"
expected = "allow"

[[case]]
description = "tn push delete"
command = "git push origin --delete feature/x"
expected = "allow"

[[case]]
description = "tn push includes"
command = "git push --force-if-includes origin main"
expected = "allow"

[[case]]
description = "tn push lease"
command = "git push --force-with-lease origin main"
expected = "allow"

[[case]]
description = "tn push plain"
command = "git push origin main"
expected = "allow"

[[case]]
description = "tn reflog show"
command = "git reflog show HEAD"
expected = "allow"

[[case]]
description = "tn remote add"
command = "git remote add upstream https://x/y.git"
expected = "allow"

[[case]]
description = "tn remote v"
command = "git remote -v"
expected = "allow"

[[case]]
description = "tn remote remove"
command = "git remote remove origin"
expected = "allow"

[[case]]
description = "tn remote set-url"
command = "git remote set-url origin git@example.invalid:x/y.git"
expected = "allow"

[[case]]
description = "tn reset soft"
command = "git reset --soft HEAD~1"
expected = "allow"

[[case]]
description = "tn stash apply"
command = "git stash apply"
expected = "allow"

[[case]]
description = "tn stash list"
command = "git stash list"
expected = "allow"

[[case]]
description = "tn stash push"
command = "git stash push -m wip"
expected = "allow"

[[case]]
description = "tn stash pop"
command = "git stash pop"
expected = "allow"

[[case]]
description = "tn update ref set"
command = "git update-ref refs/heads/x abc123"
expected = "allow"

[[case]]
description = "tn worktree add"
command = "git worktree add ../peer -b feature/x"
expected = "allow"

[[case]]
description = "tn worktree list"
command = "git worktree list"
expected = "allow"

[[case]]
description = "tn worktree prune"
command = "git worktree prune"
expected = "allow"
