# Part of https://github.com/silvarbor/dcg-plugins
#
# Custom Pack for dcg — Access-boundary protection for harnessed agents
#
# An agent's permitted area is the working directory the harness declares for
# the session. Everything else needs operator permission. Most of that boundary
# is not expressible here: a pack matches a static regex against the command
# text and cannot see the session's cwd, so no rule can compare a path argument
# against it. That half lives in agent instructions and in Claude Code's
# permissions.deny.
#
# What IS expressible is the set of actions whose blast radius does not depend
# on cwd at all — the ones with no recovery path once taken. Those are here.
#
# Schema: docs/pack.schema.yaml
# Documentation: docs/custom-packs.md

schema_version: 1

id: silvarbor.access_boundary

name: Access Boundary — Harnessed Agents

version: 2.1.0

description: |
  Blocks outward actions that a harnessed agent cannot undo: changing
  repository visibility, writing a repository secret, and publishing to a
  package registry.

  Each is reversible in state and irreversible in effect. A private repository
  made public is crawled before it is made private again. A secret exposed to
  a workflow cannot be made unknown again. Unpublishing a package is
  time-limited on npm and impossible on PyPI.

  `gh repo delete` is NOT here. platform.github:gh-repo-delete covers it, and
  duplicating a built-in rule means two messages for one action.

  `gh repo edit --visibility` IS here although platform.github ships
  gh-repo-visibility-change. In dcg 0.14.1 through 0.14.4 the built-in pack
  treats every `--help` token as a safe pattern, so `gh repo edit
  --description --help --visibility public` — where gh reads `--help` as the
  description's value and changes visibility — passes the built-in rule.
  This rule matches the command shape and ignores `--help`, and a pack's safe
  patterns suppress only that pack's own rules, so on those versions the
  denial comes from here. dcg 0.15.3 denies that shape in the built-in rule,
  also after an intervening argument carrying a shell metacharacter, and the
  built-in rule takes attribution. This rule's token walk is bounded: such an
  argument, quoted or not, stops the walk.

  Covered:
    - `gh repo edit --visibility`
    - `gh secret set`
    - npm / pnpm / yarn / poetry / cargo publish, twine upload, gem push

  Allowed (not matched):
    - `gh pr create`, `gh pr list`, `gh pr view`, `gh pr merge`
    - package publish commands with a supported `--dry-run` option
    - `gh secret list`, `gh repo edit` without `--visibility`

# Keywords are a PRE-FILTER, not documentation: a command containing none of
# them never reaches this pack's patterns. `twine upload` and `gem push` were
# silently unmatched until their command names were listed here, while
# `npm publish` and `cargo publish` matched from the start. Every command name
# a pattern can match MUST appear below.
#
# The rules deliberately do NOT declare `executables`. dcg resolves that scope
# in the evaluator, and the resolution gives up past 96 wrapper tokens,
# dropping the rule and answering ALLOW. 0.11 gave up on long assignment
# prefixes too; 0.14 still gives up on `command command … gh`. Unlike the Git
# pack, nothing else catches the long form here. Each pattern anchors its own
# command name, so the declaration was redundant with the anchor.
keywords:
  - gh
  - npm
  - pnpm
  - yarn
  - poetry
  - cargo
  - twine
  - gem

destructive_patterns:
  - name: gh-repo-visibility-change
    # `gh repo edit --visibility`. Reversible in one call and permanent in
    # fact: a repository made public is in the events firehose, GHArchive,
    # and scraper caches before it can be made private again. Kept alongside
    # the built-in rule because the built-in pack's `--help` safe pattern
    # swallows `--help` in an option-value position in dcg 0.14.1 through
    # 0.14.4; see the pack description. test/cases/custom_pack.tsv asserts
    # that this rule denies that shape on its own;
    # test/cases/worktree_isolated.tsv pins the effective verdict. The token
    # walk is bounded and stops at a shell metacharacter, quoted or not.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>]*/)?gh\s+repo\s+edit\s+(?:[^\s&;|`()<>]+\s+)*--visibility\b
    severity: critical
    description: "`gh repo edit --visibility` blocked — a repository made public stays public in every cache that saw it"
    explanation: |
      Flipping visibility is one call each way, so it reads as reversible. It
      is not. GitHub's public events firehose, GHArchive, forks, and scrapers
      ingest a public repository within seconds, and reverting the flag
      removes none of that.

      The same reasoning applies in the other direction for a repository other
      people depend on, but the public direction is the one that cannot be
      walked back.

      Change visibility from the web UI, deliberately, or have the operator
      run the command.

  - name: gh-secret-write
    # `gh secret set`. Writing a secret is not itself destructive, but it
    # places credential material into a repository's Actions environment,
    # where every workflow — including one added later by someone else — can
    # read it. Reading and listing are untouched.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>]*/)?gh\s+secret\s+set\b
    severity: high
    description: "`gh secret set` blocked — grants every workflow in the repository access to the credential"
    explanation: |
      A repository secret is readable by every workflow in that repository,
      including workflows added after the secret was written. On a repository
      that accepts pull requests, that is a wider audience than the command
      suggests.

      Have the operator set the secret, or ask before changing it.

  - name: registry-publish
    # Publishing to a package registry. npm's unpublish window is 72 hours
    # and narrower once others depend on the version; PyPI has no unpublish
    # at all; crates.io yanks but never removes.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:(?:[^\s&;|`()<>]*/)?npm\s+(?:(?:(?:--workspace|-w|--prefix|--location)\s+[^\s&;|`()<>]+|--(?:workspace|prefix|location)=[^\s&;|`()<>]+|--(?:workspaces|include-workspace-root|global))\s+)*publish\b(?!(?:\s+[^\s&;|`()<>]+)*\s+--dry-run(?:=true)?(?:\s|$))|(?:[^\s&;|`()<>]*/)?pnpm\s+(?:(?:(?:--filter|--dir|-C)\s+[^\s&;|`()<>]+|--(?:filter|dir)=[^\s&;|`()<>]+|--workspace-root)\s+)*publish\b(?!(?:\s+[^\s&;|`()<>]+)*\s+--dry-run(?:=true)?(?:\s|$))|(?:[^\s&;|`()<>]*/)?yarn\s+(?:(?:--cwd\s+[^\s&;|`()<>]+|--cwd=[^\s&;|`()<>]+)\s+)*publish\b(?!(?:\s+[^\s&;|`()<>]+)*\s+--dry-run(?:=true)?(?:\s|$))|(?:[^\s&;|`()<>]*/)?poetry\s+(?:(?:(?:--directory|-C|--project|-P)\s+[^\s&;|`()<>]+|--(?:directory|project)=[^\s&;|`()<>]+)\s+)*publish\b(?!(?:\s+[^\s&;|`()<>]+)*\s+--dry-run(?:=true)?(?:\s|$))|(?:[^\s&;|`()<>]*/)?cargo\s+(?:\+[^\s&;|`()<>]+\s+)?(?:(?:(?:--color|-C|--config|-Z)\s+[^\s&;|`()<>]+|--(?:color|config)=[^\s&;|`()<>]+|-(?:V|v|q)|--(?:version|list|verbose|quiet|locked|offline|frozen))\s+)*publish\b(?!(?:\s+[^\s&;|`()<>]+)*\s+--dry-run(?:=true)?(?:\s|$))|(?:[^\s&;|`()<>]*/)?twine\s+upload\b|(?:[^\s&;|`()<>]*/)?gem\s+push\b)
    severity: critical
    description: "package registry publish blocked — a published version cannot be recalled"
    explanation: |
      A published version is downloaded, cached, and pinned by other people
      within minutes. npm allows unpublish for 72 hours and refuses once
      another package depends on the version. PyPI has no unpublish. crates.io
      yanks a version from resolution but never removes the artifact.

      This is the clearest case of an action that is trivial to run and
      impossible to undo, so it is blocked regardless of which skill or
      workflow asks for it.

      Use a supported `--dry-run` option first. Publish from CI on a tag, or
      have the operator run the command.
