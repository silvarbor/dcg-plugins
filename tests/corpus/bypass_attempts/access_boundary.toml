# bypass attempts / silvarbor.access_boundary

[[case]]
description = "a publish help command must not protect a neighbouring publish"
command = "npm publish --help; npm publish"
expected = "deny"
rule_id = "silvarbor.access_boundary:registry-publish"

[[case]]
description = "a wrapper must not hide a registry publish"
command = "sudo npm publish"
expected = "deny"
rule_id = "silvarbor.access_boundary:registry-publish"
