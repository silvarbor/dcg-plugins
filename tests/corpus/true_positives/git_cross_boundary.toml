# true positives / Git operations that cross a worktree boundary

[[case]]
description = "gc --prune=all destroys the shared object store"
command = "git gc --aggressive --prune=all"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-recovery-data-destroy"

[[case]]
description = "gc --prune=now destroys shared unreachable objects"
command = "git gc --prune=now"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-recovery-data-destroy"

[[case]]
description = "prune destroys unreachable objects in the shared store"
command = "git prune"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-recovery-data-destroy"

[[case]]
description = "immediate reflog expiration destroys shared recovery data"
command = "git reflog expire --expire=now --all"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-recovery-data-destroy"

[[case]]
description = "immediate unreachable reflog expiration destroys shared recovery data"
command = "git reflog expire --expire-unreachable=now --all"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-recovery-data-destroy"

[[case]]
description = "split immediate reflog expiration destroys shared recovery data"
command = "git reflog expire --expire now --all"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-recovery-data-destroy"

[[case]]
description = "split immediate unreachable expiration remains guarded after reordered options"
command = "git reflog expire --all --expire-unreachable now"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-recovery-data-destroy"

[[case]]
description = "update-ref -d deletes a shared ref"
command = "git update-ref -d refs/heads/x"
expected = "deny"
rule_id = "silvarbor.git_safety:git-ref-delete-plumbing"

[[case]]
description = "update-ref --stdin can delete shared refs in a transaction"
command = "git update-ref --stdin"
expected = "deny"
rule_id = "silvarbor.git_safety:git-ref-delete-plumbing"

[[case]]
description = "worktree remove can delete a peer worktree"
command = "git worktree remove ../peer"
expected = "deny"
rule_id = "silvarbor.git_safety:git-worktree-remove"

[[case]]
description = "forced worktree removal can delete uncommitted peer files"
command = "git worktree remove --force ../peer"
expected = "deny"
rule_id = "silvarbor.git_safety:git-worktree-remove"

[[case]]
description = "mirror push force-updates every remote ref"
command = "git push --mirror origin"
expected = "deny"
rule_id = "silvarbor.git_safety:git-push-refspec-force"

[[case]]
description = "leading plus force-updates a remote refspec"
command = "git push origin +main:main"
expected = "deny"
rule_id = "silvarbor.git_safety:git-push-refspec-force"

# Upstream core.git owns these common destructive forms.
[[case]]
description = "plain long force push is covered upstream"
command = "git push --force origin main"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "plain short force push is covered upstream"
command = "git push -f origin main"
expected = "deny"
rule_id = "core.git:push-force-short"

[[case]]
description = "stash clear is covered upstream"
command = "git stash clear"
expected = "deny"
rule_id = "core.git:stash-clear"

[[case]]
description = "stash drop is covered upstream"
command = "git stash drop"
expected = "deny"
rule_id = "core.git:stash-drop"
