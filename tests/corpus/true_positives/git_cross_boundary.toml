# true positives / git cross boundary
#
# Corpus cases for the silvarbor dcg packs, in the format documented at
# tests/corpus/README.md upstream. Run with:
#
#     dcg corpus -d tests/corpus --baseline tests/baseline.json
#
# NOTE: `dcg corpus` evaluates PACK MATCHING and does not apply allowlist.toml.
# Cases whose expected verdict depends on an allowlist entry cannot live here;
# they are in test/cases/*.tsv and run by test/run.sh. See test/README.md.


[[case]]
description = "gc --prune=all destroys the shared object store"
command = "git gc --aggressive --prune=all"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-object-store-destroy"

[[case]]
description = "gc --prune=now destroys unreferenced objects other worktrees may need"
command = "git gc --prune=now"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-object-store-destroy"

[[case]]
description = "prune destroys unreachable objects in the shared store"
command = "git prune"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-object-store-destroy"

[[case]]
description = "push --force rewrites remote history with no verification"
command = "git push --force origin main"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "push -f rewrites remote history with no verification"
command = "git push -f origin main"
expected = "deny"
rule_id = "core.git:push-force-short"

[[case]]
description = "push --mirror force-updates every ref on the remote"
command = "git push --mirror origin"
expected = "deny"
rule_id = "silvarbor.git_safety:git-push-refspec-force"

[[case]]
description = "push +refspec force-updates the remote with no --force flag present"
command = "git push origin +main:main"
expected = "deny"
rule_id = "silvarbor.git_safety:git-push-refspec-force"

[[case]]
description = "reflog expire destroys the shared recovery log"
command = "git reflog expire --expire=now --all"
expected = "deny"
rule_id = "silvarbor.git_safety:git-shared-object-store-destroy"

[[case]]
description = "remote remove repoints the remote for every worktree"
command = "git remote remove origin"
expected = "deny"
rule_id = "silvarbor.git_safety:git-remote-repoint"

[[case]]
description = "remote rm repoints the remote for every worktree"
command = "git remote rm origin"
expected = "deny"
rule_id = "silvarbor.git_safety:git-remote-repoint"

[[case]]
description = "remote set-url repoints the remote for every worktree"
command = "git remote set-url origin git@x:y.git"
expected = "deny"
rule_id = "silvarbor.git_safety:git-remote-repoint"

[[case]]
description = "stash clear destroys every shared stash entry"
command = "git stash clear"
expected = "deny"
rule_id = "core.git:stash-clear"

[[case]]
description = "stash drop mutates refs/stash, which is shared across the worktree pool"
command = "git stash drop"
expected = "deny"
rule_id = "core.git:stash-drop"

[[case]]
description = "stash pop removes a shared stash entry"
command = "git stash pop"
expected = "deny"
rule_id = "silvarbor.git_safety:git-stash-shared-stack-mutation"

[[case]]
description = "update-ref -d deletes a shared ref, bypassing git's worktree guard"
command = "git update-ref -d refs/heads/x"
expected = "deny"
rule_id = "silvarbor.git_safety:git-ref-delete-plumbing"

[[case]]
description = "update-ref --stdin can delete shared refs in bulk"
command = "git update-ref --stdin"
expected = "deny"
rule_id = "silvarbor.git_safety:git-ref-delete-plumbing"

[[case]]
description = "worktree prune removes peer worktree administrative data"
command = "git worktree prune"
expected = "deny"
rule_id = "silvarbor.git_safety:git-worktree-destroy"

[[case]]
description = "worktree remove destroys a peer agent's worktree and its staged work"
command = "git worktree remove ../peer"
expected = "deny"
rule_id = "silvarbor.git_safety:git-worktree-destroy"

[[case]]
description = "worktree remove --force destroys a peer worktree unconditionally"
command = "git worktree remove --force ../peer"
expected = "deny"
rule_id = "silvarbor.git_safety:git-worktree-destroy"
