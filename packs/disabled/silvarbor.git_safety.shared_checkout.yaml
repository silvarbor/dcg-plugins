# Custom Pack for dcg — Git protection for agents sharing a working tree
#
# Companion to silvarbor.git_safety.worktree_isolated. Enable this pack when
# multiple agents share a single working tree (a real shared checkout,
# or two agents operating in one worktree). In that setup, one agent's
# working-tree-destroying command can wipe another agent's uncommitted
# work, and untracked files in the shared tree may belong to a different
# agent than the one running the command.
#
# Originated after `git stash` from one agent absorbed a concurrent
# agent's uncommitted changes, dropping work that was never recovered.
# Blocks the `git stash` family plus adjacent working-tree-destroying
# commands and unsafe force-pushes.
#
# Read-only and reversible variants are carved out via safe_patterns:
#   - git stash list / show
#   - git restore --staged
#   - git clean -n / --dry-run
#   - git push --force-with-lease / --force-if-includes
#
# Pattern conventions — kept in lockstep with the worktree_isolated pack
# so a swap between the two never changes matching behaviour. Every
# pattern here, destructive and safe alike, opens with:
#
#   (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*       <- real command position
#   (?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}     <- env assignments
#   (?:(?:sudo|command|nohup|time)\s+){0,2}       <- command wrappers
#   git\s+
#
# and walks intervening tokens with the bounded class [^\s&;|`()<>]+
# rather than \S+ or `.*`. Three defects motivate both conventions:
#
#   - the older prefix (?:^|[^[:alnum:]_-]) accepted ANY non-word
#     character before `git`, so prose *describing* a hazard matched as
#     if it *performed* one (a handoff document was blocked on
#     2026-07-27 purely for containing the words)
#   - \S+ and `.*` span `&&`, `;` and `|` into unrelated commands, so a
#     destructive pattern fires on a harmless neighbour
#   - the same overreach in a *safe* pattern fails OPEN: `.*` let
#     `git push --force origin main; echo --force-with-lease` satisfy
#     the verified-push carve-out. Nothing was actually permitted,
#     because core.git:push-force-long denies it independently, but the
#     carve-out must not depend on another pack for correctness.
#
# The repetitions are bounded ({0,4}, {0,2}) rather than starred so a
# long non-matching command line cannot drive nested-quantifier
# backtracking past the hook evaluation budget.
#
# KNOWN LIMIT: this cannot fix backtick-delimited prose. In shell, `cmd`
# IS command substitution, so dcg extracts the span and scans it as a
# command; the extracted text starts at ^ and legitimately matches.
# Markdown code spans and shell command substitution are byte-identical,
# so no pack-level regex can separate them. Pass prose bodies by redirect
# or file argument rather than inline. Single and double quotes are fine.
#
# Schema: docs/pack.schema.yaml
# Documentation: docs/custom-packs.md

schema_version: 1

id: silvarbor.git_safety

name: Git Safety — Shared Working Tree

version: 1.1.0

description: |
  Blocks destructive git operations that overwrite or remove uncommitted
  work, or that rewrite remote history without verification. Originated
  after a `git stash` from one agent silently absorbed a concurrent
  agent's working-tree changes, which were then lost.

  Enable this pack when multiple agents share a single working tree. For
  setups where each agent runs in its own git worktree, see the
  companion pack silvarbor.git_safety.worktree_isolated, which blocks only
  what escapes the worktree boundary — the shared common git dir
  (refs/stash, the object store, reflogs, refs/heads) and the remote —
  and leaves reset, restore, and path checkout to the calling agent.

  Covered:
    - git stash (push, pop, apply, drop, clear, save, branch)
    - git checkout -- / git checkout . / git checkout HEAD <path>
    - git restore (without --staged)
    - git reset (all modes, incl. --soft / --mixed / --hard)
    - git clean -f (and -fd, -fdx, etc.)
    - git branch -d / -D
    - git push --force / -f

  Allowed (via safe_patterns):
    - git stash list / show
    - git restore --staged
    - git clean -n / --dry-run
    - git push --force-with-lease / --force-if-includes

keywords:
  - git

destructive_patterns:
  - name: git-stash
    # Matches the bare `git stash` and every subcommand. Read-only forms
    # (`list`, `show`) are carved out via safe_patterns below. The token
    # walker after `git` admits `git -C <path> stash`.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*stash\b
    severity: critical
    description: git stash blocked — silently absorbs concurrent agents' working trees
    explanation: |
      `git stash` (push, pop, apply, drop, clear, save, branch) moves
      working-tree changes onto a stack. When multiple agents share a
      repository, one agent's stash can pull in another agent's
      uncommitted changes, which then disappear from `git status` and
      are easy to destroy via `stash drop`, `stash clear`, or pop
      conflicts. Recovery requires reflog spelunking and is often
      incomplete.

      Safe alternatives:
        - Commit the changes on a branch (WIP commits are fine)
        - Ask the user to stash if isolation is genuinely required
        - `git stash list` / `git stash show` (allowed) to inspect
          existing stashes without modifying state

  - name: git-checkout-discard
    # Matches `git checkout -- <path>`, `git checkout .`, and
    # `git checkout HEAD <path>`. Plain branch switches like
    # `git checkout main` are not matched.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*checkout\s+(?:--|\.(?:\s|$)|HEAD\b)
    severity: critical
    description: git checkout discarding working-tree changes blocked
    explanation: |
      `git checkout -- <path>`, `git checkout .`, and
      `git checkout HEAD <path>` overwrite uncommitted working-tree
      changes with the index or HEAD contents. There is no recovery.

      Safe alternatives:
        - `git diff <path>` first to see what would be lost
        - Ask the user to discard if that is genuinely the intent
        - `git checkout <branch>` (branch switching) is not blocked

  - name: git-restore-worktree
    # Broad match; the `--staged` (reversible unstage) form is carved
    # out via safe_patterns below.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*restore\b
    severity: critical
    description: git restore (without --staged) discards working-tree changes
    explanation: |
      `git restore <path>` overwrites working-tree changes with the
      index contents. Same blast radius as `git checkout -- <path>`.

      Safe alternatives:
        - `git restore --staged <path>` (allowed) — only unstages, reversible
        - Ask the user to discard if genuinely intended

  - name: git-reset
    # Matches every form of `git reset`: bare, --soft, --mixed (default),
    # --hard, --merge, --keep, `git reset <commit>`, `git reset HEAD <path>`.
    # No carve-out — to unstage, use `git restore --staged <path>` (allowed).
    #
    # NOTE: this rule is specific to the shared-checkout setup. Under
    # worktree isolation, reset was verified to be worktree-local (A's
    # `reset --hard` leaves B's HEAD and tree untouched) and is allowed
    # there. Do not port this rule to the worktree_isolated pack.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*reset\b
    severity: critical
    description: git reset blocked — moves HEAD and corrupts the agent's view of repo state
    explanation: |
      `git reset` in any mode (--soft, --mixed/default, --hard, --merge,
      --keep) moves the current branch's HEAD. `--hard` additionally
      discards working-tree changes in one step. Run against a moving ref
      such as origin/main, even `--soft` rewinds HEAD relative to the
      commits the agent just made, re-exposing those commits as staged or
      working-tree changes — which the agent then misreads as files the
      *user* added to the shared worktree and reports as a false
      discrepancy. Recovery from `--hard` requires the reflog and is
      often incomplete.

      `--soft` is the most dangerous of the non-destructive modes
      precisely because it looks harmless: nothing in the working tree
      changes and no data is lost, only HEAD moves — so there is no
      destructive signal, yet the agent's model of repository state is
      already wrong.

      Safe alternatives:
        - `git restore --staged <path>` (allowed) — unstage without moving HEAD
        - `git log` / `git status` to inspect state before acting
        - Ask the user to run the reset manually if a HEAD move is
          genuinely required

  - name: git-clean-force
    # Matches `-f` in any single-cluster flag (e.g. -f, -fd, -fdx). The
    # token walker after `clean` also catches the split form `-d -f`.
    # The `-n` / `--dry-run` forms are carved out via safe_patterns.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*clean\s+(?:[^\s&;|`()<>]+\s+)*-[A-Za-z]*f
    severity: critical
    description: git clean -f blocked — permanently deletes untracked files
    explanation: |
      `git clean -f` (including -fd, -fx, -fdx) permanently deletes
      untracked files and directories. Untracked files routinely contain
      another agent's in-progress work that has not yet been staged.

      Safe alternatives:
        - `git clean -n` / `--dry-run` (allowed) shows what would be deleted
        - Ask the user to clean if genuinely intended

  - name: git-branch-delete
    # Matches `git branch -d` and `git branch -D`, including forms with
    # intervening flags (`git branch -r -d`).
    #
    # NOTE: also specific to the shared-checkout setup. Under worktree
    # isolation git itself refuses to delete a branch checked out in
    # another worktree, and the commits stay reflog-recoverable, so
    # branch deletion is allowed there.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*branch\s+(?:[^\s&;|`()<>]+\s+)*-[dD]\b
    severity: high
    description: git branch deletion blocked
    explanation: |
      `git branch -D` force-deletes branches including unmerged work.
      `git branch -d` deletes merged branches that may carry context
      another agent depends on. Commits are reflog-recoverable in most
      cases, but the disruption to another agent's workflow is real and
      immediate.

      Safe alternatives:
        - `git branch` to list branches first
        - Ask the user to delete the branch

  - name: git-push-force
    # Matches `git push --force` and `git push -f` in any flag position.
    # `--force(?![-a-z])` excludes `--force-with-lease` and
    # `--force-if-includes` in the pattern itself rather than relying on
    # the safe_pattern carve-out alone.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*push\s+(?:[^\s&;|`()<>]+\s+)*(?:--force(?![-a-z])|-[a-zA-Z]*f[a-zA-Z]*\b)
    severity: critical
    description: git push --force blocked — overwrites remote branch history without verification
    explanation: |
      `git push --force` (or `-f`) overwrites the remote branch history
      without checking what's there. If a teammate or another agent has
      pushed in the meantime, their commits are silently destroyed on
      the remote.

      Safe alternatives:
        - `git push --force-with-lease` (allowed) only force-pushes when
          the remote matches what you last fetched, preventing accidental
          overwrites of others' work
        - `git push --force-if-includes` (allowed) is stricter still
        - For shared branches (main, master, release/*), ask the user
          before any history rewrite, even with --force-with-lease

safe_patterns:
  - name: git-stash-readonly
    # `git stash list` and `git stash show` only read state.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*stash\s+(?:list|show)\b
    description: git stash list / show are read-only and allowed

  - name: git-restore-staged
    # `git restore --staged <path>` only unstages — fully reversible.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*restore\s+(?:[^\s&;|`()<>]+\s+)*--staged\b
    description: git restore --staged only unstages and is reversible

  - name: git-clean-dry-run-long
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*clean\s+(?:[^\s&;|`()<>]+\s+)*--dry-run\b
    description: git clean --dry-run is read-only and allowed

  - name: git-clean-dry-run-short
    # Matches `-n` in any single-cluster flag (e.g. -n, -nf, -dn, -fdn).
    # When `-n` is present, the operation is dry-run regardless of -f.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*clean\s+(?:[^\s&;|`()<>]+\s+)*-[A-Za-z]*n
    description: git clean -n (any combination) is dry-run and allowed

  - name: git-push-force-verified
    # `--force-with-lease` and `--force-if-includes` verify the remote
    # state before rewriting history. Bounded walker rather than `.*`:
    # `.*` let a `--force-with-lease` token anywhere later on the line
    # (after a `;`, in an echo) satisfy the carve-out for an unrelated
    # unverified force push.
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=[^\s]*\s+){0,4}(?:(?:sudo|command|nohup|time)\s+){0,2}git\s+(?:[^\s&;|`()<>]+\s+)*push\s+(?:[^\s&;|`()<>]+\s+)*--force-(?:with-lease|if-includes)\b
    description: git push --force-with-lease / --force-if-includes verify remote state
