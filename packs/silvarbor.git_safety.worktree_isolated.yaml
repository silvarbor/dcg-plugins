# Part of https://github.com/silvarbor/dcg-plugins
#
# Custom Pack for dcg - cross-boundary protection for worktree-isolated agents
#
# Each agent runs in its own Git worktree. HEAD, the index, and the working
# tree belong to that worktree. The common Git directory and remotes remain
# shared. This pack blocks only operations that can destroy those shared
# resources or delete a peer worktree.
#
# Destructive patterns use dcg 0.10 executable scoping and retain a real
# command-position anchor. Git global options are generic option tokens; the
# only supported split-value forms, -C and -c, consume their declared value.
#
# Schema: docs/pack.schema.yaml
# Documentation: docs/custom-packs.md

schema_version: 1

id: silvarbor.git_safety

name: Git Safety - Worktree-Isolated Agents

version: 2.0.0

description: |
  Protects resources that remain shared when each agent uses a separate Git
  worktree. The pack blocks peer worktree removal, immediate object or reflog
  expiration, ref deletion through update-ref, and remote force updates that
  do not use the ordinary force flags.

  The built-in core.git pack handles plain force pushes, stash deletion, and
  destructive commands inside one worktree. The user allowlist permits the
  worktree-local commands that cannot cross this pack's boundary.

  Covered:
    - git worktree remove
    - git gc --prune=now or --prune=all
    - git prune, except dry runs
    - git reflog expire with immediate expiration
    - git update-ref -d or --stdin
    - git push +<refspec> or --mirror

  Allowed:
    - git worktree add, list, prune, and prune --dry-run
    - git remote remove, rm, and set-url
    - git stash pop; core.git still guards stash drop and clear
    - git push --force-with-lease and --force-if-includes
    - worktree-local reset, checkout, restore, and branch deletion

keywords:
  - git

destructive_patterns:
  - name: git-worktree-remove
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>]*/)?git\s+(?:(?:-(?:C|c)\s+(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")\s+)|(?:-[^\s&;|`()<>]+\s+))*worktree\s+(?:[^\s&;|`()<>]+\s+)*remove\b
    executables:
      - git
    severity: critical
    description: git worktree remove blocked - can delete another agent's worktree and its uncommitted files
    explanation: |
      `git worktree remove --force <path>` deletes the target directory. Files
      that were never committed do not exist in the object store or a reflog.

      Inspect the target first:
        - git worktree list
        - git -C <path> status --short

      Ask the user to remove a worktree after they confirm that it is idle.

  - name: git-shared-recovery-data-destroy
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>]*/)?git\s+(?:(?:-(?:C|c)\s+(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")\s+)|(?:-[^\s&;|`()<>]+\s+))*(?:gc\s+(?:[^\s&;|`()<>]+\s+)*--prune=(?:now|all)\b|prune\b(?!-)(?!(?:\s+[^\s&;|`()<>]+)*\s+(?:-n|--dry-run)\b)|reflog\s+expire\s+(?:[^\s&;|`()<>]+\s+)*--expire(?:-unreachable)?(?:=|\s+)(?:now|all)\b)
    executables:
      - git
    severity: critical
    description: immediate Git object or reflog expiration blocked - destroys recovery data shared by every worktree
    explanation: |
      Every worktree uses the same object store and reflogs. Immediate
      expiration can remove another agent's only recovery path after an amend,
      rebase, or ref deletion.

      Use `git prune --dry-run` to inspect candidates. Plain `git gc` keeps its
      configured retention period.

  - name: git-ref-delete-plumbing
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>]*/)?git\s+(?:(?:-(?:C|c)\s+(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")\s+)|(?:-[^\s&;|`()<>]+\s+))*update-ref\s+(?:[^\s&;|`()<>]+\s+)*(?:-d\b|--stdin\b)
    executables:
      - git
    severity: critical
    description: git update-ref deletion blocked - bypasses Git's worktree-aware porcelain checks
    explanation: |
      `git update-ref -d` deletes a shared ref without the guard that protects a
      branch checked out in another worktree. The stdin protocol can perform
      the same deletion in a transaction whose body is not always visible to
      this rule.

      Use the relevant Git porcelain command, or ask the user to approve the
      plumbing operation.

  - name: git-push-refspec-force
    pattern: (?:^|[\n;&|(]|\b(?:then|else|do)\s+)\s*(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^\s&;|`()<>"']*|'[^']*'|"(?:[^"\\]|\\.)*")\s+)*(?:(?:sudo|command|nohup|time)\s+)*(?:[^\s&;|`()<>]*/)?git\s+(?:(?:-(?:C|c)\s+(?:[^\s&;|`()<>"']+|'[^']*'|"(?:[^"\\]|\\.)*")\s+)|(?:-[^\s&;|`()<>]+\s+))*push\s+(?:[^\s&;|`()<>]+\s+)*(?:\+[^\s&;|`()<>]+|--mirror\b)
    executables:
      - git
    severity: critical
    description: forced refspec or mirror push blocked - can overwrite multiple remote refs without verification
    explanation: |
      A leading `+` forces its refspec. `--mirror` force-updates every remote
      ref and can delete refs that do not exist locally. Neither form provides
      the lease check that protects concurrent remote work.

      Use an ordinary push. If a history rewrite is required, use
      `--force-with-lease` for the intended ref only.
